name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact-name: weread-checkin-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact-name: weread-checkin-win-x64
          - os: macos-latest
            rid: osx-x64
            artifact-name: weread-checkin-osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0"

      - name: Publish AOT
        run: |
          dotnet publish app.cs -c Release -r ${{ matrix.rid }} --self-contained -p:DebugSymbols=false -p:StripSymbols=true -o publish/${{ matrix.artifact-name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: publish/${{ matrix.artifact-name }}
          retention-days: 10

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate a changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: weread-checkin-*
          merge-multiple: true
          skip-decompress: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
